[project]
name = "ntl-mcp"
version = "0.1.0"
description = "Independent MCP server for NTULearn (Blackboard Learn public REST). Not affiliated with NTU or Anthology."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "ntl-mcp contributors" }]
keywords = ["mcp", "ntulearn", "blackboard"]
dependencies = [
    "beautifulsoup4>=4.12",
    "browser-cookie3>=0.20.1",
    "httpx>=0.28.1",
    "keyring>=25.0",
    "mcp[cli]>=1.27.0,<2",
    "openpyxl>=3.1",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "python-pptx>=1.0",
]

[project.scripts]
ntl-mcp = "ntl_mcp.server:main"
ntl-save-cookie = "ntl_mcp.auth:save_cookie_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ntl_mcp"]
